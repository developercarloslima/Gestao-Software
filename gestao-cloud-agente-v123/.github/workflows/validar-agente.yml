name: Validar agente VPS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar Python e isolamento de jobs
        run: |
          python -m compileall -q provisioner_agent.py
          python -m unittest discover -v -p 'test_*.py'
