databases:
  - name: gs107-hml-db
    plan: free
    region: virginia
    databaseName: gs107_hml
    user: gs107_hml
    postgresMajorVersion: "16"
services:
  - type: web
    name: gs107-hml-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: gestao-software-v107-central-migracao/backend
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase: {name: gs107-hml-db, property: host}
      - key: DATABASE_PORT
        fromDatabase: {name: gs107-hml-db, property: port}
      - key: DATABASE_NAME
        fromDatabase: {name: gs107-hml-db, property: database}
      - key: DATABASE_USERNAME
        fromDatabase: {name: gs107-hml-db, property: user}
      - key: DATABASE_PASSWORD
        fromDatabase: {name: gs107-hml-db, property: password}
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: GESTAO_BOOTSTRAP_CARLOS_PASSWORD
        generateValue: true
      - key: GESTAO_BOOTSTRAP_PEDRO_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://gs107-hml-web.onrender.com
      - key: AUTO_PROVISION_ENABLED
        value: "false"
      - key: CLOUD_ROUTING_ENABLED
        value: "false"
      - key: CLOUD_ORCHESTRATOR_ENABLED
        value: "false"
      - key: CLOUD_DNS_PROVIDER
        value: MANUAL
      - key: TENANT_TEMPLATE_CERTIFIED
        value: "false"
      - key: GESTAO_ASAAS_BASE_URL
        value: https://api-sandbox.asaas.com/v3
  - type: web
    name: gs107-hml-web
    runtime: docker
    plan: free
    region: virginia
    rootDir: gestao-software-v107-central-migracao/web
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /
    envVars:
      - key: BACKEND_HOST
        fromService: {type: web, name: gs107-hml-api, property: host}
      - key: BACKEND_PORT
        fromService: {type: web, name: gs107-hml-api, property: port}
