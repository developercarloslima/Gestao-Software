<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030911" />
    <script>
      try {
        if (localStorage.getItem('gestao-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#eef4fa');
        }
      } catch {}
    </script>
    <meta name="description" content="Tecnologia completa para modernizar e escalar a gestão da sua empresa." />
    <title>Gestão Software 2026 — Tecnologia para empresas</title>
    <link rel="icon" type="image/png" href="/assets/logo-gestao-transparente.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
