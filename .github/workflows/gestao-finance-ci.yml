name: Gestão - testes de integridade financeira
on:
  pull_request:
    paths:
      - "gestao-software-v107-central-migracao/backend/**"
      - "gestao-software-v107-central-migracao/web/admin/**"
      - ".github/workflows/gestao-finance-ci.yml"
  push:
    branches: [main]
    paths:
      - "gestao-software-v107-central-migracao/backend/**"
      - "gestao-software-v107-central-migracao/web/admin/**"
      - ".github/workflows/gestao-finance-ci.yml"
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gestao-software-v107-central-migracao/backend/pom.xml
      - name: Compilar e executar testes Java
        run: mvn -B -ntp -f gestao-software-v107-central-migracao/backend/pom.xml clean verify
      - name: Validar sintaxe de todos os scripts do painel
        run: |
          for script in gestao-software-v107-central-migracao/web/admin/{app,onboarding,cloud,migracao}.js; do node --check "$script"; done
      - name: Testar interações e botões do Control Plane
        run: node --test gestao-software-v107-central-migracao/web/admin/tests/*.test.cjs
