server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Docker DNS dynamic resolution: optional modules may not be running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 450m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https: http://localhost:3100 http://127.0.0.1:3100; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'self'; connect-src 'self' https://formsubmit.co; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://wa.me https://formsubmit.co" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Apontamento Digital integrado no mesmo domínio da plataforma.
    # ^~ evita que as regras regex de arquivos estáticos capturem /ponto/*.js, /ponto/*.png etc.
    location = /ponto {
        return 308 /ponto/;
    }

    location ^~ /ponto-api/ {
        set $ponto_backend "ponto-api:3333";
        rewrite ^/ponto-api/(.*)$ /$1 break;
        proxy_pass http://$ponto_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location ^~ /ponto/ {
        set $ponto_front "ponto-web:80";
        rewrite ^/ponto/(.*)$ /$1 break;
        proxy_pass http://$ponto_front;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/consultar-boletos-associado {
        set $hinova_backend "hinova-api:3001";
        proxy_pass http://$hinova_backend/api/consultar-boletos-associado$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/baixar-boleto {
        set $hinova_backend "hinova-api:3001";
        proxy_pass http://$hinova_backend/api/baixar-boleto$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Upload retomável do Retrato NH. Mantemos o corpo totalmente bufferizado
    # no Nginx antes de repassar ao Tomcat. Isso desacopla a conexão móvel
    # (HTTP/2 ou HTTP/3 via Caddy) do backend e evita EOF/ClientAbort no meio
    # do corpo quando o navegador oscila ou o proxy downstream demora.
    location ~ ^/api/public/inspections/[^/]+/upload-chunk-raw$ {
        client_body_timeout 300s;
        client_body_buffer_size 1m;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering on;
    }

    # Importação de dados pessoais: limite separado das mídias grandes de vistoria.
    location ^~ /api/admin/importacao/ {
        client_max_body_size 3m;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering on;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location /cota/ { try_files $uri $uri/ /cota/index.html; }
    location /associado/ { try_files $uri $uri/ /associado/index.html; }
    location /associados/ { try_files $uri $uri/ /associados/index.html; }
    location /veiculos/ { try_files $uri $uri/ /veiculos/index.html; }
    location /comparacao/ { try_files $uri $uri/ /comparacao/index.html; }
    location /colaborador/ { try_files $uri $uri/ /colaborador/index.html; }
    location /checklist/ { try_files $uri $uri/ /checklist/index.html; }
    location /guincho/ { try_files $uri $uri/ /guincho/index.html; }
    location /oficina/ { try_files $uri $uri/ /oficina/index.html; }
    location /financeiro/ { try_files $uri $uri/ /financeiro/index.html; }
    location /aceite-evento/ { try_files $uri $uri/ /aceite-evento/index.html; }
    location /ciencia-pecas/ { try_files $uri $uri/ /ciencia-pecas/index.html; }
    location /aceite-termo/ { try_files $uri $uri/ /aceite-termo/index.html; }
    location /retrato/ { try_files $uri $uri/ /retrato/index.html; }
    location /confirmacao-valor/ { try_files $uri $uri/ /confirmacao-valor/index.html; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /analise/ { try_files $uri $uri/ /analise/index.html; }
    location /supervisao/ { try_files $uri $uri/ /supervisao/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
