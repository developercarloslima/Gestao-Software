name: Publicar imagens base (Gestão Software)
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    uses: ./.github/workflows/validacao-integracao.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nh-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.tenant
          - name: nh-web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: nh-ponto-api
            context: ./nh-ponto
            dockerfile: ./nh-ponto/Dockerfile.api
          - name: nh-ponto-web
            context: ./nh-ponto
            dockerfile: ./nh-ponto/Dockerfile.web
          - name: nh-fipe-api
            context: ./api-fipe
            dockerfile: ./api-fipe/Dockerfile
          - name: nh-hinova-api
            context: ./hinova-api
            dockerfile: ./hinova-api/Dockerfile
          - name: nh-face-api
            context: ./face-attendance-api
            dockerfile: ./face-attendance-api/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recusar imagens não certificadas (marcas, usuários e senhas de clientes anteriores)
        run: python3 ci/auditar_template.py --root . --tenant-runtime
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
