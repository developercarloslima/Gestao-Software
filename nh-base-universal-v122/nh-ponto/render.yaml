services:
  - type: web
    name: pontoproof
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pontoproof-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BIOMETRIC_ENCRYPTION_KEY
        generateValue: true
      - key: AUDIT_PRIVACY_HASH_KEY
        generateValue: true
      - key: PRESENCE_SIGNING_SECRET
        generateValue: true
      - key: BIOMETRIC_STORAGE_DIR
        value: /tmp/pontoproof-biometrics
      - key: WORK_MONITOR_STORAGE_DIR
        value: /tmp/pontoproof-work-monitor
      - key: WORK_MONITOR_RETENTION_DAYS
        value: "3"
      - key: BIOMETRIC_NOTICE_VERSION
        value: 2026-09-v1
      - key: WEBAUTHN_RP_NAME
        value: PontoProof
      - key: DEMO_SEED
        value: "true"

databases:
  - name: pontoproof-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: pontoproof
    user: pontoproof
