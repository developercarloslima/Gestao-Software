<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070c40" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/ponto/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/ponto/favicon-nh.png" />
    <meta property="og:image" content="https://nhprotecao.com.br/ponto/nh-share-blue-v8371.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://nhprotecao.com.br/ponto/nh-share-blue-v8371.png" />
    <title>Apontamento Digital | Empresa Cliente</title>
    <script>
      // O módulo de ponto utiliza a mesma identidade do tenant nos ícones da aba.
      fetch('/api/public/tenant-config', {cache:'no-store'}).then(r=>r.ok?r.json():null).then(c=>{
        if(!c || c.active===false)return;
        const logo=String(c.logoUrl||'');
        if(!/^https:\/\//.test(logo) || /\/assets\/logo-gestao-software\.png(?:[?#]|$)/i.test(logo))return;
        document.querySelectorAll('link[rel="icon"]').forEach(link=>{
          link.href=logo;link.removeAttribute('type');
        });
      }).catch(()=>{});
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
