services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pontoproof
      POSTGRES_USER: pontoproof
      POSTGRES_PASSWORD: pontoproof
    ports:
      - "5432:5432"
    volumes:
      - pontoproof_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontoproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pontoproof_pg:
